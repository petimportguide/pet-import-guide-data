[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "petimportguide-mcp"
version = "1.0.0"
description = "MCP server for Pet Import Guide — verified pet import rules (routes, airline pet policies, rule changes) from official government sources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC BY 4.0 (data) / MIT (code)" }
dependencies = ["mcp>=1.0,<2"]

[project.scripts]
petimportguide-mcp = "server:main"

[tool.setuptools]
py-modules = ["server"]
